<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Nota</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- ===== หน้ารายการโน้ต ===== -->
  <section id="listView" class="view">
    <header class="topbar">
      <div class="brand">
        <img src="icons/icon32.png" alt="" width="22" height="22">
        <span>My Nota</span>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="btnPanel" title="เปิดใน Side Panel">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
        </button>
        <button class="icon-btn" id="btnMenu" title="เมนู">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
        </button>
      </div>
    </header>

    <div class="search-row">
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="ค้นหาโน้ต… / Search…" autocomplete="off">
      </div>
      <button class="new-btn" id="btnNew" title="โน้ตใหม่ (Ctrl+Alt+N)" data-icon="plus">ใหม่</button>
    </div>

    <div class="filters" id="filters">
      <button class="chip active" data-filter="all">ทั้งหมด</button>
      <button class="chip" data-filter="pinned" data-icon="pin">ปักหมุด</button>
      <button class="chip" data-filter="code" data-icon="code">มีโค้ด</button>
    </div>

    <main id="board" class="board"></main>

    <div id="empty" class="empty" hidden>
      <div class="empty-note">
        <p class="empty-title">ยังไม่มีโน้ต</p>
        <p>กด <b>+ ใหม่</b> เพื่อแปะ Post-it แผ่นแรก</p>
      </div>
    </div>
  </section>

  <!-- ===== หน้าแก้ไขโน้ต ===== -->
  <section id="editorView" class="view" hidden>
    <header class="topbar editor-bar">
      <button class="icon-btn" id="btnBack" title="กลับ (Esc)">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="colors" id="colors"></div>
      <div class="top-actions">
        <button class="icon-btn" id="btnPin" title="ปักหมุด">
          <svg viewBox="0 0 24 24"><path d="M9 4h6l-1 6 4 4H6l4-4z"/><path d="M12 14v6"/></svg>
        </button>
        <button class="icon-btn danger" id="btnDelete" title="ลบโน้ต">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
        </button>
      </div>
    </header>

    <div class="paper-wrap" id="paperWrap">
      <article class="paper" id="paper">
        <div class="paper-tape"></div>
        <div class="title-row">
          <div class="title" id="title" contenteditable="plaintext-only" data-placeholder="ไม่มีชื่อ" spellcheck="false"></div>
        </div>
        <div class="meta" id="meta"></div>
        <div class="blocks" id="blocks"></div>
        <button class="add-block" id="btnAddBlock" data-icon="plus">เพิ่มบล็อก <span>หรือพิมพ์ <kbd>/</kbd></span></button>
      </article>
    </div>

    <div class="quickbar">
      <button data-format="bold" title="ตัวหนา (Ctrl+B)" data-icon="bold"></button>
      <button data-format="italic" title="ตัวเอียง (Ctrl+I)" data-icon="italic"></button>
      <button data-insert="todo" title="To-do" data-icon="todo"></button>
      <button data-insert="h1" title="หัวข้อ" data-icon="h1"></button>
      <button data-insert="bullet" title="รายการ" data-icon="bullet"></button>
      <button data-insert="quote" title="อ้างอิง" data-icon="quote"></button>
      <button data-insert="draw" title="วาดรูป" data-icon="brush"></button>
      <button data-insert="code" class="code-q" title="บล็อกโค้ด" data-icon="code">Code</button>
    </div>
  </section>

  <footer class="statusbar">
    <span class="sync" id="sync"><i></i><span id="syncText">กำลังโหลด…</span></span>
    <span class="quota" id="quota" title="พื้นที่ Chrome Sync">
      <span class="bar"><span id="quotaFill"></span></span>
      <span id="quotaText"></span>
    </span>
  </footer>

  <!-- popovers -->
  <div class="popover" id="slashMenu" hidden></div>
  <div class="popover" id="blockMenu" hidden></div>
  <div class="popover color-pop" id="colorPop" hidden></div>
  <div class="popover" id="mainMenu" hidden>
    <button data-act="export" data-icon="download">ส่งออกโน้ตทั้งหมด (.json)</button>
    <button data-act="import" data-icon="upload">นำเข้าโน้ต (.json)</button>
    <button data-act="tab" data-icon="external">เปิดในแท็บใหม่</button>
    <div class="menu-note" id="syncHelp">
      โน้ตซิงก์ผ่าน <b>Chrome Sync</b> — ทุกเครื่องที่ล็อกอิน Chrome ด้วยบัญชี Google เดียวกันและติดตั้ง Extension นี้จะเห็นโน้ตชุดเดียวกัน
    </div>
  </div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <div class="toast" id="toast" hidden></div>

  <script src="js/icons.js"></script>
  <script src="js/colors.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/highlight.js"></script>
  <script src="js/draw.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
